name: Deploy Azure VM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get GitHub Runner Token
        id: runner_token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await github.actions.createRegistrationTokenForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.setOutput("token", token.data.token);

      - name: Deploy VM
        run: |
          az group create -n rg-github-runner -l eastus
          az deployment group create \
            -g rg-github-runner \
            --template-file main.bicep \
            --parameters adminSshPublicKey="${{ secrets.ADMIN_SSH_KEY }}" \
                         githubRunnerRegistrationToken="${{ steps.runner_token.outputs.token }}" \
                         githubScopeUrl="https://api.github.com/repos/${{ github.repository }}"

